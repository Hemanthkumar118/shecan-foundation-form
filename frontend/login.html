<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter Email"
            required
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="#">Forgot Password?</a>

    <p id="loginMessage"></p>

</div>

<script src="script.js"></script>

</body>
</html>
